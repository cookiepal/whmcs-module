name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Attach the zip to the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag, Module::VERSION and CHANGELOG.md agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "public const VERSION = '${version}';" modules/servers/cookiepal/lib/Module.php; then
            echo "Module::VERSION isn't ${version}." >&2
            exit 1
          fi
          if ! grep -qE "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated heading for ${version}, such as '## ${version} (2026-01-31)'." >&2
            exit 1
          fi

      - name: Build
        run: scripts/build-zip.sh

      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/cookiepal-whmcs-${GITHUB_REF_NAME#v}.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --verify-tag --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          fi
